name: Build and Push Image

on:
  push:
    branches:
      - master
    paths-ignore:
      - "README.md"
      - "deploy/**"
  workflow_dispatch:
    inputs:
      app_repo:
        description: Ant Browser source repository
        required: false
        default: noir017/Ant-Browser
        type: string
      app_ref:
        description: Branch, tag or SHA of the source repository
        required: false
        default: master
        type: string
      image_tag:
        description: Extra image tag to publish, for example 1.6.0
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ant-browser
  APP_REPO: ${{ inputs.app_repo || 'noir017/Ant-Browser' }}
  APP_REF: ${{ inputs.app_ref || 'master' }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # Each architecture builds on a native runner: cross-building the Wails/CGO
    # binary is unreliable, and so is running the image checks under QEMU.
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.stage.outputs.version }}
      app_sha: ${{ steps.stage.outputs.app_sha }}

    steps:
      - name: Checkout container definition
        uses: actions/checkout@v4

      - name: Checkout Ant Browser source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: src

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      # Mirrors the app's own .github/workflows/publish-linux.yml so the build
      # environment matches what upstream releases are produced with.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            git \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            python3 \
            tar

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Reuse the project's own publish script: it handles the webkit 4.0/4.1
      # pkg-config probe (adding the webkit2_41 build tag), verifies the pinned
      # xray/sing-box hashes, and assembles the tarball layout the image expects.
      - name: Build Linux package
        working-directory: src
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: "1"
        run: bash publish/linux/publish-linux.sh --arch ${{ matrix.arch }}

      - name: Stage tarball for image build
        id: stage
        run: |
          set -euo pipefail
          tar_file="$(ls -1 src/publish/output/AntBrowser-*-linux-${{ matrix.arch }}.tar.gz | head -n 1)"
          echo "Staging: $tar_file"

          # Fail early rather than shipping an image whose app cannot start.
          validate_dir="$(mktemp -d)"
          tar -xzf "$tar_file" -C "$validate_dir"
          test -x "$validate_dir/ant-chrome"
          test -x "$validate_dir/bin/xray"
          test -x "$validate_dir/bin/sing-box"
          test -f "$validate_dir/config.yaml"

          mkdir -p dist
          cp "$tar_file" dist/AntBrowser-linux-${{ matrix.arch }}.tar.gz

          version="$(basename "$tar_file" | sed -E 's/^AntBrowser-(.+)-linux-${{ matrix.arch }}\.tar\.gz$/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app_sha=$(git -C src rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Built version $version"

      # The same tarball that goes into the image (plus the .deb), for running
      # the app outside Docker.
      - name: Upload app package
        uses: actions/upload-artifact@v4
        with:
          name: AntBrowser-linux-${{ matrix.arch }}
          path: |
            src/publish/output/AntBrowser-*-linux-${{ matrix.arch }}.tar.gz
            src/publish/output/*_${{ matrix.arch }}.deb
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image repository
        id: repo
        run: echo "name=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Pushed by digest only; the merge job attaches the tags once every
      # architecture has passed its checks.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.stage.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            net.antbrowser.app.repo=${{ env.APP_REPO }}
            net.antbrowser.app.ref=${{ env.APP_REF }}
            net.antbrowser.app.revision=${{ steps.stage.outputs.app_sha }}

      # A missing shared library only shows up as "the GUI never appears", so
      # assert the link closure now, on the image we just pushed.
      - name: Verify image dependency closure
        env:
          IMAGE: ${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          arch="$(docker run --rm --entrypoint uname "$IMAGE" -m)"
          echo "Image reports machine: $arch"
          missing="$(docker run --rm --entrypoint bash "$IMAGE" -c \
            'ldd /opt/ant-browser/ant-chrome | grep "not found" || true')"
          if [[ -n "$missing" ]]; then
            echo "::error::unresolved shared libraries in image:"
            echo "$missing"
            exit 1
          fi
          echo "All shared libraries resolved."
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'for b in socat vncserver websockify fluxbox dbus-run-session curl ss xdpyinfo jq; do
               command -v "$b" > /dev/null || { echo "missing: $b"; exit 1; }
             done'
          echo "Required runtime tools present."
          # Browser cores are supplied at runtime, so CI cannot ldd a real core.
          # Assert the libraries Chromium needs are resolvable instead — a missing
          # NSS stack only shows up as "instances won't start" on the target host.
          docker run --rm --entrypoint bash "$IMAGE" -c '
            missing=""
            for lib in libnss3.so libnssutil3.so libsmime3.so libnspr4.so \
                       libgbm.so.1 libasound.so.2 libatk-1.0.so.0 libatspi.so.0 \
                       libcups.so.2 libdrm.so.2 libxkbcommon.so.0 libXcomposite.so.1 \
                       libXdamage.so.1 libXrandr.so.2 libXtst.so.6 libpango-1.0.so.0; do
              ldconfig -p | grep -q "$lib" || missing="$missing $lib"
            done
            if [ -n "$missing" ]; then echo "missing core libs:$missing"; exit 1; fi
            echo "Chromium core libraries resolvable."
          '
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'bash -n /opt/scripts/start.sh && bash -n /opt/scripts/start-server.sh && bash -n /opt/scripts/antctl'
          echo "Container scripts parse cleanly."

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch tags
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push tags
        id: tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          repo="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          tags=(
            "${repo}:latest"
            "${repo}:${{ needs.build.outputs.version }}"
            "${repo}:app-${{ needs.build.outputs.app_sha }}"
          )
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            tags+=("${repo}:${{ inputs.image_tag }}")
          fi
          tag_args=()
          for tag in "${tags[@]}"; do tag_args+=(-t "$tag"); done
          sources=()
          for digest in *; do sources+=("${repo}@sha256:${digest}"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| app version | \`${{ needs.build.outputs.version }}\` |"
            echo "| app repo | \`${{ env.APP_REPO }}\` |"
            echo "| app ref | \`${{ env.APP_REF }}\` |"
            echo "| app commit | \`${{ needs.build.outputs.app_sha }}\` |"
            echo "| platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
            echo ""
            echo "App packages are attached to this run as \`AntBrowser-linux-amd64\` / \`AntBrowser-linux-arm64\`."
          } >> "$GITHUB_STEP_SUMMARY"
